[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomicvault"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "redis>=7.2.0",
    "minio>=7.2.20",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.22",
    "httpx",
    "typer",
    "cryptography",
]

[project.scripts]
atomicvault = "atomicvault.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*deprecated usage of input argument.*:DeprecationWarning",
]
