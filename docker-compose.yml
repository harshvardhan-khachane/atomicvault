services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    restart: on-failure
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: atomicvault
      MINIO_SECURE: "0"
      MAX_FILE_SIZE_BYTES: "10485760"
      JANITOR_ENABLED: "1"
      JANITOR_INTERVAL_SECONDS: "60"
      JANITOR_OLDER_THAN_SECONDS: "3600"
    depends_on:
      - redis
      - minio
    ports:
      - "8000:8000"
    command: >
      sh -c "uvicorn atomicvault.app:app --host 0.0.0.0 --port 8000"

volumes:
  minio_data: